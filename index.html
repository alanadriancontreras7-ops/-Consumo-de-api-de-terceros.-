<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Personajes - Rick and Morty</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Rick and Morty </h1>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Buscar personaje por nombre...">
      <button id="search-btn">Buscar</button>
    </div>
  </header>

  <main class="main-container">
    <div id="loading" class="status-message hidden">Cargando personajes...</div>
    <div id="error-message" class="status-message hidden"></div>
    <section id="characters-grid" class="grid-container"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
